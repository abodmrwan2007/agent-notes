# XcodeGen spec. Generate the Xcode project on a Mac with:
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is a build product of this file and is not committed.
name: AgentNotes

options:
  bundleIdPrefix: com.agentnotes
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"            # iPad only
    APP_DISPLAY_NAME: Agent Notes           # working title; change here only
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AgentNotesCore:
    path: Packages/AgentNotesCore
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  AgentNotes:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AgentNotesCore
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentnotes.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                # set your Apple team ID to run on a device
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Face ID unlocks the notebooks you have locked.
        NSPhotoLibraryUsageDescription: Pictures you choose are added to your notes.
        NSMicrophoneUsageDescription: The microphone records lectures while you take notes. Recordings stay inside your notebook.
        # The native editable notebook package (a directory treated as one file).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.agentnotes.document
            UTTypeDescription: Agent Notes Notebook
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - agentnote

  # End-to-end smoke tests driven through the UI on an iPad simulator.
  AgentNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AgentNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentnotes.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentNotes

  # Compile check for the Swift Playgrounds variant. Its sources are generated by
  # `python tools/build_playground.py`; this target only proves they build as one module
  # without GRDB. The deliverable is the .swiftpm package, not this target.
  AgentNotesPlayground:
    type: application
    platform: iOS
    sources:
      - path: build/playground/AgentNotes.swiftpm
        optional: true
        excludes:
          - Package.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentnotes.playground
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent Notes

schemes:
  AgentNotesPlayground:
    build:
      targets:
        AgentNotesPlayground: all
  AgentNotes:
    build:
      targets:
        AgentNotes: all
        AgentNotesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentNotesUITests
