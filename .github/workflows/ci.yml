name: CI

on:
  push:
    # Documentation-only changes do not spend CI minutes.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap Linux job: static checks and the platform-neutral core package.
  core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Core unit tests
        run: swift test --package-path Packages/AgentNotesCore

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strings, JSON and delimiter checks
        run: python3 tools/check_strings.py

  # macOS job: generates the Xcode project and compiles the iPad app for the simulator.
  # macOS minutes are billed at a higher rate on private repositories, so this only
  # runs after the cheap jobs pass.
  app:
    needs: [core, static-checks]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Assemble the Swift Playgrounds variant
        run: python3 tools/build_playground.py
      - name: Generate project
        run: xcodegen generate
      - name: Compile the Swift Playgrounds sources (single module, no GRDB)
        run: |
          set +e
          xcodebuild \
            -project AgentNotes.xcodeproj \
            -scheme AgentNotesPlayground \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build > playground-build.log 2>&1
          STATUS=$?
          set -e
          grep -E " error: |\*\* " playground-build.log | tail -n 40 || true
          exit $STATUS
      - name: Check that Xcode accepts the playground Package.swift (informational)
        continue-on-error: true
        run: |
          cd build/playground/AgentNotes.swiftpm
          xcodebuild -list 2>&1 | tail -n 30
          xcodebuild -scheme AgentNotes -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > ../../../playground-package-build.log 2>&1
          STATUS=$?
          grep -E " error: |\*\* " ../../../playground-package-build.log | tail -n 40 || true
          exit $STATUS
      - name: Upload the playground package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground
          path: |
            build/playground/AgentNotes.swiftpm.zip
            playground-build.log
            playground-package-build.log
          if-no-files-found: warn
      - name: Pick an iPad simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices[runtime]:
                  if 'iPad Pro' in device['name']:
                      print(device['udid']); sys.exit(0)
          sys.exit('no iPad simulator found')
          ")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build and run UI smoke tests on the simulator
        env:
          SHOTS_DIR: /tmp/agentnotes-shots
        run: |
          mkdir -p "$SHOTS_DIR"
          set +e
          xcodebuild \
            -project AgentNotes.xcodeproj \
            -scheme AgentNotes \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            test > build.log 2>&1
          STATUS=$?
          set -e
          grep -E " error: |\*\* |Test Case .* (passed|failed)|XCTAssert|Executed [0-9]+ tests" build.log | tail -n 60 || true
          ls -la "$SHOTS_DIR" || true
          exit $STATUS
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/agentnotes-shots
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
